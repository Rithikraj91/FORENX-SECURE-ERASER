[package]
name = "forenx-eraser-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "ForenX Secure Eraser Tauri shell"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

drive_eraser = { path = "../crates/drive_eraser" }
file_eraser = { path = "../crates/file_eraser" }
eraser_common = { path = "../crates/eraser_common" }

[[bin]]
name = "forenx-eraser-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false , features = [] }
